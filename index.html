<style>

  --text: #333;
  --text-light: #666;
  --text-muted: #999;
  --border: #E8E8E8;
  --bg: #F5F7FA;
  --card-bg: #FFF;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* Header */
.header {

}
.header h1 { font-size: 26px; margin-bottom: 6px; }
.header .subtitle { font-size: 13px; opacity: 0.85; margin-bottom: 8px; }
.header .meta {

  flex-wrap: wrap;
  justify-content: center;
}
.header .meta span {

  background: rgba(255,255,255,0.15);
  border-radius: 20px;
  font-size: 13px;
}

/* Toolbar */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--card-bg);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  padding: 12px 20px;
}
.toolbar-row {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box .icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
}
.filter-select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--card-bg);
  cursor: pointer;
  outline: none;
}
.filter-select:focus { border-color: var(--primary); }
.result-count {
  font-size: 13px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* Container */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

/* Card grid */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}

/* Tariff card */
.tariff-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow 0.2s, transform 0.2s;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}
.tariff-card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}
.card-header {
  padding: 14px 18px;
  background: var(--primary-light);
  border-bottom: 1px solid var(--border);
}
.card-header h3 {
  font-size: 16px;
  color: var(--primary);
  font-weight: 600;
  margin-bottom: 4px;
}
.card-header .price {
  font-size: 24px;
  color: var(--accent);
  font-weight: 700;
}
.card-header .price .unit {
  font-size: 13px;
  font-weight: 400;
}
.card-header .badges {
  margin-top: 4px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.badge {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
}
.badge-bt { background: #E3F2FD; color: #1565C0; }
.badge-rg { background: #F3E5F5; color: #7B1FA2; }

.card-body {
  padding: 12px 18px;
  flex: 1;
}
.card-body table {
  width: 100%;
  font-size: 13px;
  border-collapse: collapse;
}
.card-body table td {
  padding: 5px 0;
  border-bottom: 1px solid #F5F5F5;
  vertical-align: top;
}
.card-body table td:first-child {
  color: var(--text-light);
  width: 35%;
  white-space: nowrap;
}
.card-body table td:last-child {
  color: var(--text);
  font-weight: 500;
}
.card-body .gray-section {
  margin-top: 8px;
  padding: 8px 10px;
  background: #FAFAFA;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-light);
}
.card-body .gray-section .gray-row {
  margin-bottom: 4px;
}
.card-body .gray-section .gray-label {
  color: var(--text-muted);
  font-weight: 600;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 20px;
  overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: var(--radius);
  max-width: 700px;
  width: 100%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  overflow: hidden;
}
.modal-header {
  padding: 20px 24px;
  background: linear-gradient(135deg, var(--primary) 0%, #0066CC 100%);
  color: #FFF;
  position: relative;
}
.modal-header h2 { font-size: 20px; margin-bottom: 8px; }
.modal-header .modal-price { font-size: 28px; font-weight: 700; }
.modal-header .modal-price .unit { font-size: 14px; font-weight: 400; }
.modal-header .close-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border: none;
  background: rgba(255,255,255,0.2);
  color: #FFF;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-header .close-btn:hover { background: rgba(255,255,255,0.3); }
.modal-body {
  padding: 20px 24px;
  max-height: 60vh;
  overflow-y: auto;
}
.modal-body h4 {
  font-size: 15px;
  color: var(--primary);
  margin: 16px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.modal-body h4:first-child { margin-top: 0; }
.modal-body table {
  width: 100%;
  font-size: 14px;
  border-collapse: collapse;
}
.modal-body table td {
  padding: 6px 0;
  border-bottom: 1px solid #F0F0F0;
  vertical-align: top;
}
.modal-body table td:first-child {
  color: var(--text-light);
  width: 30%;
  white-space: nowrap;
}
.modal-body .gray-block {
  margin-top: 8px;
  padding: 10px 14px;
  background: #FAFAFA;
  border-radius: 6px;
}
.modal-body .gray-block .gray-label {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 2px;
}
.modal-body .gray-block .gray-value {
  font-size: 13px;
  color: var(--text);
  white-space: pre-wrap;
}

/* Empty */
.empty-state {

  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

/* Footer */
.footer {
  text-align: center;
  padding: 24px 20px;
  color: var(--text-muted);
  font-size: 13px;
  border-top: 1px solid var(--border);
}
.footer a { color: var(--primary); text-decoration: none; }

/* Tab nav */
.tab-nav {

  display: flex;
  gap: 8px;
  padding: 14px 20px 0;
}
.tab-btn {

  font-size: 15px;
  font-weight: 600;

.tab-btn:hover { background: #D5E2F2; }
.tab-btn.active {

  color: var(--primary);
  box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Overview */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.kpi-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);

.panel {

  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 24px;
  margin-bottom: 20px;

.panel-title {

.chart-scroll { overflow-x: auto; }

.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.daily-table { width: 100%; border-collapse: collapse; font-size: 13px; }

</head>

function extractPrice(str) {
  if (!str) return 0;
  const m = str.match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}

function parseDate(str) {
  if (!str) return new Date(0);
  const m = str.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if (m) return new Date(m[1], m[2]-1, m[3]);
  return new Date(0);
}

function doFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const fbt = document.getElementById('filterBigTab').value;
  const frg = document.getElementById('filterRange').value;
  const fpr = document.getElementById('filterPrice').value;
  const sort = document.getElementById('sortBy').value;

  let filtered = TARIFFS.filter(t => {
    if (fbt && t.bt !== fbt) return false;
    if (frg && t.rg !== frg) return false;
    if (fpr) {
      const [min, max] = fpr.split('-').map(Number);
      const price = extractPrice(t.a && t.a['资费标准']);
      if (price < min || price > max) return false;
    }
    if (q) {
      const allText = (t.n + ' ' + JSON.stringify(t.a) + ' ' + JSON.stringify(t.d)).toLowerCase();
      if (!allText.includes(q)) return false;
    }
    return true;
  });

  if (sort === 'price-asc') filtered.sort((a,b) => extractPrice(a.a['资费标准']) - extractPrice(b.a['资费标准']));
  else if (sort === 'price-desc') filtered.sort((a,b) => extractPrice(b.a['资费标准']) - extractPrice(a.a['资费标准']));
  else if (sort === 'date-desc') filtered.sort((a,b) => parseDate(b.a['上线日期']) - parseDate(a.a['上线日期']));

  document.getElementById('resultCount').textContent = '找到 ' + filtered.length + ' 条';

  const grid = document.getElementById('cardGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">&#128194;</div><p>未找到匹配的资费方案</p></div>';
    return;
  }
  grid.innerHTML = filtered.map((t, i) => {
    const price = t.a['资费标准'] || '-';
    const mainFields = ['国内通话','国内通用流量','定向流量','宽带','移动高清','短信','权益'];
    const detailRows = mainFields.filter(k => t.d && t.d[k]).map(k => '<tr><td>' + k + '</td><td>' + t.d[k] + '</td></tr>').join('');
    const exceedInfo = t.d && t.d['超出资费说明'] ? '<div class="gray-section"><div class="gray-row"><span class="gray-label">超出说明:</span> ' + t.d['超出资费说明'].substring(0,80) + (t.d['超出资费说明'].length > 80 ? '...' : '') + '</div></div>' : '';
    return '<div class="tariff-card" onclick="showDetail(' + i + ')" data-idx="' + i + '">' +
      '<div class="card-header"><h3>' + t.n + '</h3>' +
      '<div class="price">' + price.replace('元/月','<span class="unit">元/月</span>') + '</div>' +
      '<div class="badges"><span class="badge badge-bt">' + t.bt + '</span><span class="badge badge-rg">' + t.rg + '</span></div>' +
      '</div><div class="card-body"><table>' + detailRows + '</table>' + exceedInfo + '</div></div>';
  }).join('');

  // 保存当前过滤后的数据引用
  window._filtered = filtered;
}

function showDetail(idx) {
  const t = window._filtered[idx];
  if (!t) return;

  const price = t.a['资费标准'] || '-';
  const attrItems = Object.entries(t.a).map(([k,v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('');
  const detailItems = Object.entries(t.d || {}).filter(([k,v]) => !['超出资费说明','其他服务内容','其他说明'].includes(k)).map(([k,v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('');
  const grayBlocks = ['超出资费说明','其他服务内容','其他说明'].filter(k => t.d && t.d[k]).map(k =>
    '<div class="gray-block"><div class="gray-label">' + k + '</div><div class="gray-value">' + t.d[k] + '</div></div>'
  ).join('');

  document.getElementById('modalContent').innerHTML =
    '<div class="modal-header"><button class="close-btn" onclick="closeModalDirect()">&times;</button>' +
    '<h2>' + t.n + '</h2><div class="modal-price">' + price.replace('元/月','<span class="unit">元/月</span>') + '</div>' +
    '<div style="margin-top:6px"><span class="badge badge-bt">' + t.bt + '</span> <span class="badge badge-rg">' + t.rg + '</span></div></div>' +
    '<div class="modal-body">' +
    '<h4>基本信息</h4><table>' + attrItems + '</table>' +
    (detailItems ? '<h4>套餐内容</h4><table>' + detailItems + '</table>' : '') +
    (grayBlocks ? '<h4>补充说明</h4>' + grayBlocks : '') +
    '</div>';

  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('show');
  }
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ===== 总览页 =====
function switchTab(name) {
  document.getElementById('tabOverviewBtn').classList.toggle('active', name === 'overview');
  document.getElementById('tabListBtn').classList.toggle('active', name === 'list');
  document.getElementById('panelOverview').classList.toggle('active', name === 'overview');
  document.getElementById('panelList').classList.toggle('active', name === 'list');
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function extractPrice(str) {
  if (!str) return 0;
  const m = str.match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}

function renderOverview() {
  const total = TARIFFS.length;

  // KPI
  const dates = {};
  TARIFFS.forEach(t => {
    const d = (t.a && t.a['上线日期']) || '';
    dates[d] = (dates[d] || 0) + 1;
  });
  const dateKeys = Object.keys(dates).sort((a,b) => parseDate(a) - parseDate(b));
  const recent = dateKeys.slice(-3).reverse();
  const recentStr = recent.map(d => d + ' 上线 ' + dates[d] + ' 条').join('；');

  const bt = {}, rg = {};
  TARIFFS.forEach(t => {
    bt[t.bt] = (bt[t.bt] || 0) + 1;
    rg[t.rg] = (rg[t.rg] || 0) + 1;
  });

  let priceList = TARIFFS.map(t => extractPrice(t.a && t.a['资费标准'])).filter(p => p > 0);
  let minP = priceList.length ? Math.min(...priceList) : 0;
  let maxP = priceList.length ? Math.max(...priceList) : 0;
  let avgP = priceList.length ? (priceList.reduce((s,x) => s+x, 0) / priceList.length).toFixed(1) : 0;

  const now = new Date();
  const recent30 = dateKeys.filter(d => (now - parseDate(d)) <= 30*24*3600*1000)
    .reduce((s,d) => s + dates[d], 0);

  document.getElementById('kpiGrid').innerHTML =
    '<div class="kpi-card"><div class="kpi-label">在售资费总数</div><div class="kpi-value">' + total + '<span class="unit"> 条</span></div><div class="kpi-sub">个人 ' + (bt['个人资费']||0) + ' · 政企 ' + (bt['政企资费']||0) + '</div></div>' +
    '<div class="kpi-card accent"><div class="kpi-label">近30天新上线</div><div class="kpi-value">' + recent30 + '<span class="unit"> 条</span></div><div class="kpi-sub">' + (recent.length ? '最近：' + recentStr : '') + '</div></div>' +
    '<div class="kpi-card"><div class="kpi-label">全网资费</div><div class="kpi-value">' + (rg['全网资费']||0) + '<span class="unit"> 条</span></div><div class="kpi-sub">覆盖全省统一资费</div></div>' +
    '<div class="kpi-card"><div class="kpi-label">江苏资费</div><div class="kpi-value">' + (rg['江苏资费']||0) + '<span class="unit"> 条</span></div><div class="kpi-sub">江苏本地定制资费</div></div>' +
    '<div class="kpi-card"><div class="kpi-label">月费区间</div><div class="kpi-value">' + minP + ' ~ ' + maxP + '<span class="unit"> 元</span></div><div class="kpi-sub">平均 ' + avgP + ' 元/月</div></div>';

  // 每日上线柱状图
  renderDailyChart(dateKeys, dates);

  // 分类分布
  renderCatChart(bt, rg);

  // 每日明细表
  const rows = dateKeys.map(d => {
    const pct = (dates[d] / total * 100).toFixed(1);
    return '<tr><td>' + d + '</td><td class="num">' + dates[d] + ' 条</td><td style="width:40%"><div style="background:#EAF1FA;border-radius:4px;height:14px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:var(--primary);border-radius:4px"></div></div></td><td>' + pct + '%</td></tr>';
  }).join('');
  document.getElementById('dailyTable').innerHTML = '<thead><tr><th>上线日期</th><th>数量</th><th>占比</th><th>比例</th></tr></thead><tbody>' + rows + '</tbody>';
}

function renderDailyChart(dateKeys, dates) {
  const max = Math.max(...dateKeys.map(d => dates[d]));
  const W = Math.max(560, dateKeys.length * 46);
  const H = 260, padL = 46, padR = 10, padT = 18, padB = 52;
  const bw = (W - padL - padR) / dateKeys.length;
  const bh = (H - padT - padB) / max;

  let bars = '';
  dateKeys.forEach((d, i) => {
    const x = padL + i * bw;
    const h = dates[d] * bh;
    const y = H - padB - h;
    bars += '<rect x="' + (x + bw*0.12) + '" y="' + y + '" width="' + (bw*0.76) + '" height="' + Math.max(h,2) + '" rx="4" fill="#0052B4" opacity="0.9">' +
      '<title>' + d + ' 上线 ' + dates[d] + ' 条</title></rect>' +
      '<text x="' + (x + bw/2) + '" y="' + (y - 5) + '" text-anchor="middle" font-size="10" fill="#666">' + dates[d] + '</text>';
    // 日期标签（每隔一个显示，避免拥挤；带两位年份便于跨年区分）
    if (dateKeys.length <= 14 || i % Math.ceil(dateKeys.length / 14) === 0 || i === dateKeys.length - 1) {
      const m = d.match(/^(\d{2})(\d{2})年(\d{1,2})月(\d{1,2})日$/);
      const short = m ? m[2] + '/' + m[3] + '/' + m[4] : d;
      bars += '<text x="' + (x + bw/2) + '" y="' + (H - padB + 20) + '" text-anchor="middle" font-size="10" fill="#888">' + short + '</text>';
    }
  });

  // Y轴刻度
  const ticks = 4;
  let yTicks = '';
  for (let i = 0; i <= ticks; i++) {
    const v = Math.round(max * i / ticks);
    const y = H - padB - (max * i / ticks) * bh;
    yTicks += '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end" font-size="10" fill="#999">' + v + '</text>' +
      '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#EEE" stroke-width="1" stroke-dasharray="3,3"/>';
  }

  document.getElementById('dailyChart').innerHTML =
    '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    yTicks + bars +
    '</svg>';
}

function renderCatChart(bt, rg) {
  const total = TARIFFS.length;
  const items = [
    {label: '个人·全网', val: countBy('个人资费','全网资费')},
    {label: '个人·江苏', val: countBy('个人资费','江苏资费')},
    {label: '政企·全网', val: countBy('政企资费','全网资费')},
    {label: '政企·江苏', val: countBy('政企资费','江苏资费')}
  ];
  function countBy(bt, rg) { return TARIFFS.filter(t => t.bt === bt && t.rg === rg).length; }
  const max = Math.max(...items.map(i => i.val), 1);
  const bars = items.map(i =>
    '<div class="bar-row"><div class="bar-label">' + i.label + '</div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + (i.val / max * 100) + '%">' + i.val + '</div></div></div>'
  ).join('');
  document.getElementById('catChart').innerHTML = bars;
}

// 初始化
renderOverview();
doFilter();
</script>
